<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}EcoTransit | Smart Green Mobility{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header class="navbar">
        <a href="{{ url_for('main.home') }}" class="logo">
            <span class="logo-icon">E</span>
            <span>EcoTransit</span>
        </a>

        <nav class="nav-links">
            <a href="#home">Home</a>
            <a href="#features">Features</a>
            <a href="#transport">Transport</a>
        </nav>

        <a href="#journey-search" class="nav-button">Plan a Journey</a>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>EcoTransit — Smarter Journeys, Greener Lahore.</p>
        <p>Designed to support sustainable urban mobility.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
